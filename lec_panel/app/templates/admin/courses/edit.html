{% extends "admin/base_admin.html" %}

{% block title %}Edit {{ course.course_name }} - Admin{% endblock %}

{% block content %}
{% set fd = form_data or {} %}
<div class="container mt-4" style="max-width: 700px;">
    <div class="mb-4">
        <a href="{{ url_for('admin_courses.view', course_code=course.course_code) }}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Back to {{ course.course_code }}
        </a>
        <h1 class="h3 mt-2"><i class="bi bi-pencil me-2"></i>Edit Course</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Course Code</label>
                    <input type="text" class="form-control" value="{{ course.course_code }}" disabled>
                    <div class="form-text">Course code cannot be changed.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Course Name <span class="text-danger">*</span></label>
                    <input type="text" name="course_name" class="form-control" required maxlength="200"
                           value="{{ fd.get('course_name', course.course_name) }}">
                </div>

                <div class="mb-4">
                    <label class="form-label">Faculty</label>
                    <input type="text" name="faculty" class="form-control" maxlength="100"
                           value="{{ fd.get('faculty', course.faculty or '') }}">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Save Changes
                    </button>
                    <a href="{{ url_for('admin_courses.view', course_code=course.course_code) }}"
                       class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
