{% extends "admin/base_admin.html" %}

{% block title %}New Lecturer - Admin{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 700px;">
    <div class="mb-4">
        <a href="{{ url_for('admin_lecturers.index') }}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Back to lecturers
        </a>
        <h1 class="h3 mt-2"><i class="bi bi-person-plus me-2"></i>New Lecturer</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Instructor ID <span class="text-danger">*</span></label>
                    <input type="text" name="instructor_id" class="form-control"
                           value="{{ form_data.get('instructor_id', '') }}"
                           placeholder="e.g. L2025003" required maxlength="50">
                    <div class="form-text">This becomes the default password. The lecturer changes it on first login.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" name="instructor_name" class="form-control"
                           value="{{ form_data.get('instructor_name', '') }}" required maxlength="200">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone <span class="text-danger">*</span></label>
                    <input type="tel" name="phone" class="form-control"
                           value="{{ form_data.get('phone', '') }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           value="{{ form_data.get('email', '') }}">
                </div>

                <div class="mb-4">
                    <label class="form-label">Faculty</label>
                    <input type="text" name="faculty" class="form-control"
                           value="{{ form_data.get('faculty', '') }}">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Create Lecturer
                    </button>
                    <a href="{{ url_for('admin_lecturers.index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
